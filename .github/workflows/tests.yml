name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
      - run: uv python install 3.14.2
      - run: uv sync --frozen --python 3.14.2
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .
