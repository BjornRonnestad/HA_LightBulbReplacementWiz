name: Publish 0.2.3

on:
  workflow_run:
    workflows: [Tests, HACS and Hassfest]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-0.2.3
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Check version and required workflows
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("custom_components/light_bulb_replacement/manifest.json"))["version"])')
          if [[ "$version" != "0.2.3" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$RELEASE_SHA&per_page=100")
          for workflow in 'Tests' 'HACS and Hassfest'; do
            if ! jq -e --arg name "$workflow" --arg sha "$RELEASE_SHA" \
              '.workflow_runs | any(.name == $name and .head_sha == $sha and .event == "push" and .conclusion == "success")' \
              <<< "$runs" >/dev/null; then
              echo "Waiting for a successful $workflow run on $RELEASE_SHA"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "publish=true" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if gh release view 0.2.3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release 0.2.3 already exists'
            exit 0
          fi
          gh release create 0.2.3 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title '0.2.3' \
            --notes-file RELEASE_NOTES_0.2.3.md
