[project]
name = "ha-light-bulb-replacement-wiz"
version = "0.1.0"
description = "A guided light entity replacement for Home Assistant"
requires-python = ">=3.14.2"

[dependency-groups]
dev = [
  "aiohasupervisor==0.6.0",
  "aiousbwatcher==1.1.2",
  "ha-silabs-firmware-client==0.3.0",
  "homeassistant==2026.10.2",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.14.14",
  "serialx==1.11.0",
  "universal-silabs-flasher==1.1.0",
  "zha==2.3.1",
  "zha-quirks==2.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff]
target-version = "py314"
